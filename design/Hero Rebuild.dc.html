<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1535,&quot;height&quot;:1024}}">
class Component extends DCLogic {
  componentDidMount() {
    const g = document.getElementById('hbStars');
    if (!g) return;
    const star = (cx, cy, R) => {
      const r = R * 0.44, pts = [];
      for (let i = 0; i < 10; i++) {
        const rad = i % 2 ? r : R, a = i * Math.PI / 5 - Math.PI / 2;
        pts.push((cx + rad * Math.cos(a)).toFixed(2) + ',' + (cy + rad * Math.sin(a)).toFixed(2));
      }
      return pts.join(' ');
    };
    let out = '';
    for (let i = 0; i < 13; i++) {
      const a = i * 2 * Math.PI / 13 - Math.PI / 2;
      out += '<polygon points="' + star(100 + 62 * Math.cos(a), 100 + 62 * Math.sin(a), 9) + '"></polygon>';
    }
    g.innerHTML = out;
  }
}

</script>
