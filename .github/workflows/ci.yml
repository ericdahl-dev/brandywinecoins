name: CI

on:
  pull_request:
  push:
    branches: [main]

# A second push to a PR makes the first run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # `npm start` runs `payload migrate` before `next start`, so the suite needs a
    # database even though every test today hits only the static page. Keeping
    # migrations in the start command rather than in Coolify's UI is deliberate:
    # #40 was about configuration living where no review sees it.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: payload
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: brandywine
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payload"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URI: postgres://payload:postgres@127.0.0.1:5432/brandywine
      PAYLOAD_SECRET: ci-only-secret

    steps:
      - uses: actions/checkout@v7

      # Read from .nvmrc rather than a literal, so CI cannot drift from the
      # version the repo declares. engines.node in package.json is what the
      # nixpacks build reads; the two are kept on the same major deliberately.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Before the browsers, so a broken build fails in seconds rather than
      # after a two-minute browser download.
      - name: Build
        run: npm run build

      # Keyed on the installed Playwright version: browsers are pinned to it, so
      # a stale cache after an upgrade would install the wrong build.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'

      # The cache restores the browser but not the shared libraries it links
      # against, which live outside ~/.cache.
      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'

      # Runs against `next start` on CI -- see playwright.config.ts. The suite is
      # mostly layout and computed style, and those are exactly the things a dev
      # build can get right while the production one does not.
      - name: Test
        run: npm test

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
