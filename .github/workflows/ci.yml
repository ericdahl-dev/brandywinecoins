name: CI

on:
  pull_request:
  push:
    branches: [main]

# A second push to a PR makes the first run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Before the browsers, so a broken build fails in seconds rather than
      # after a two-minute browser download.
      - name: Build
        run: npm run build

      # Keyed on the installed Playwright version: browsers are pinned to it, so
      # a stale cache after an upgrade would install the wrong build.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'

      # The cache restores the browser but not the shared libraries it links
      # against, which live outside ~/.cache.
      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'

      # Runs against `next start` on CI -- see playwright.config.ts. The suite is
      # mostly layout and computed style, and those are exactly the things a dev
      # build can get right while the production one does not.
      - name: Test
        run: npm test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
